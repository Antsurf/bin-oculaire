{% extends "base.html" %}
{% block content %}
<div class="title-page">
    <h1>Galerie des images</h1>
</div>

<div class="gallery-container">
    {% for img in images %}
    <div class="img-case">
        <img src="{{ img.file_path }}" alt="{{ img.auto_label }}">

        <div class="card-overlay">
            <p class="card-label">Label: {{ img.auto_label }}</p>
            <p class="card-meta">Luminosité: {{ img.luminosite }}</p>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
