{% extends 'base.html' %}

{% block content %}
<form action="/index" method="POST" enctype="multipart/form-data" id="bin-input">
    <label for="imageInput" class="image-clicker">
        <img src="{{ url_for('static', filename='/imgPlaceholder.png') }}?v=1" alt="Nouvelle image" id="imgPlaceholder" style="width: auto; height: 500px; cursor: pointer; max-width: 100%;">
    </label>
    <input type="file" id="imageInput" name="mon_image" accept="image/*" style="display: none;">

    <div class="bin-input-row" style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;">
        <input type="text" id="address" name="mon_adresse" placeholder="{{ _('Tapez une adresse...') }}" list="address-list" autocomplete="off" required>    
        <datalist id="address-list"></datalist>

        <input type="hidden" id="lat" name="lat">
        <input type="hidden" id="lon" name="lon">

        <fieldset style="border: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
            <legend style="font-size: 14px;">{{ _('Type de classification :') }}</legend>
            <label><input type="radio" name="nb_classes" value="2" checked> {{ _('Propre / Sale') }}</label>
            <label><input type="radio" name="nb_classes" value="3"> {{ _('Propre / Sale / Débordante') }}</label>
        </fieldset>

        <button type="submit" id="post-button">{{ _("Importer l'image") }}</button>
    </div>
</form>
<form action="/cas_reel" method="POST" id="form-cas-reel">
    <button type="submit" id="cas_reel">Lancer le cas reel</button>
</form>
<script>
document.getElementById('imageInput').addEventListener('change', function(event) {
    const file = event.target.files[0]; // On récupère le fichier sélectionné
    if (file) {
        const imagePlaceholder = document.getElementById('imgPlaceholder');
        imagePlaceholder.src = URL.createObjectURL(file);
    }
});
const addressInput = document.getElementById('address');
const addressList = document.getElementById('address-list');
const latInput = document.getElementById('lat');
const lonInput = document.getElementById('lon');
const cas_reel = document.getElementById('cas_reel')

addressInput.addEventListener('input', async () => {
    const query = addressInput.value;
    if (query.length < 5) return; // Attend 5 lettres pour lancer la recherche

    const response = await fetch(`https://data.geopf.fr/geocodage/search?q=${encodeURIComponent(query)}&limit=5`);
    const data = await response.json();

    addressList.innerHTML = '';
    data.features.forEach(feature => { 
        const option = document.createElement('option');
        option.value = feature.properties.label;

        // On attache les coordonnées à l'option pour les récupérer plus tard
        option.dataset.lat = feature.geometry.coordinates[1];
        option.dataset.lon = feature.geometry.coordinates[0];

        addressList.appendChild(option);
    });
});

// Quand l'utilisateur sélectionne une adresse dans la liste
addressInput.addEventListener('change', () => {
    const selectedOption = Array.from(addressList.options).find(opt => opt.value === addressInput.value);
    if (selectedOption) {
        latInput.value = selectedOption.dataset.lat;
        lonInput.value = selectedOption.dataset.lon;
    }
});
</script>
{% endblock %}
