{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h1>Tableau de bord de l'application</h1>

    <div style="display: flex; gap: 20px; margin-bottom: 30px;">
        <div style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; background: #f9f9f9; min-width: 150px;">
            <h3>Total Images</h3>
            <p id="total-images-count" style="font-size: 24px; font-weight: bold; margin: 0; color: #007bff;">...</p>
        </div>
        <div style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; background: #f9f9f9; min-width: 150px;">
            <h3>Poids Total</h3>
            <p id="total-weight" style="font-size: 24px; font-weight: bold; margin: 0; color: #28a745;">0 Ko</p>
        </div>
    </div>

    <div style="display: flex; gap: 40px; flex-wrap: wrap;">
        <div style="width: 400px;">
            <h4>Répartition IA (Auto Labels)</h4>
            <canvas id="autoLabelsChart"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    // On appelle notre API Flask dès que la page charge
    fetch('/api/dashboard-stats')
        .then(response => response.json())
        .then(data => {
            
            // A. MISE À JOUR DES TEXTES
            document.getElementById('total-images-count').innerText = data.total_images;
            
            // Calcul de la somme des tailles de fichiers reçues dans la liste [file_sizes]
            if (data.file_sizes && data.file_sizes.length > 0) {
                const totalKo = data.file_sizes.reduce((sum, current) => sum + current, 0);
                document.getElementById('total-weight').innerText = totalKo.toFixed(2) + " Ko";
            }

            // B. CRÉATION DU GRAPHIQUE (Camembert)
            // Object.keys() récupère les noms (ex: ['Déchet sauvage', 'Zone propre'])
            // Object.values() récupère les quantités (ex: [5, 12])
            const labelsIA = Object.keys(data.automatic_labels);
            const valeursIA = Object.values(data.automatic_labels);

            const ctx = document.getElementById('autoLabelsChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut', // Un graphique en forme de donut, très moderne
                data: {
                    labels: labelsIA,
                    datasets: [{
                        label: 'Nombre d\'images',
                        data: valeursIA,
                        backgroundColor: [
                            '#ff6384',
                            '#36a2eb', 
                            '#ffcd56'  
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });

        })
        .catch(error => console.error("Erreur lors de la récupération des stats :", error));
</script>
{% endblock %}
