{% extends "base.html" %}
{% block content %}

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <div id="map-container">
        <div class="title-page">
            <h1>{{ _('Carte des zones à risque de débordement') }}</h1>
        </div>
        <div id="map-filter" class="map-filter">
            <span class="map-filter-label">{{ _('Filtrer par état :') }}</span>
            <label class="map-filter-item">
                <input type="checkbox" class="filtre-etat" value="propre" checked>
                <span class="dot" style="background:green;"></span>{{ _('Propre') }}
            </label>
            
            <label class="map-filter-item">
                <input type="checkbox" class="filtre-etat" value="sale" checked>
                <span class="dot" style="background:orange;"></span>{{ _('Sale') }}
            </label>
            <label class="map-filter-item">
                <input type="checkbox" class="filtre-etat" value="debordante" checked>
                <span class="dot" style="background:red;"></span>{{ _('Débordante') }}
            </label>
            <label class="map-filter-item">
                <input type="checkbox" class="filtre-etat" value="inconnu" checked>
                <span class="dot" style="background:gray;"></span>{{ _('Inconnu') }}
            </label>
        </div>
        <div id="map"></div>
    </div>

    <script>
        // Initialisation de la carte
        const map = L.map('map').setView([48.8566, 2.3522], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Création du groupe de cluster
        const markers = L.markerClusterGroup();
        map.addLayer(markers);

        // Toutes les features chargées depuis l'API (non filtrées)
        let toutesLesFeatures = [];

        // Couleurs associées à chaque état de classification
        const couleursEtat = {
            "propre": "green",
            "sale": "orange",
            "debordante": "red",
            "inconnu": "gray"
        };

        const traductionsEtat = {
            "propre": "{{ _('Propre') }}",
            "sale": "{{ _('Sale') }}",
            "debordante": "{{ _('Débordante') }}",
            "inconnu": "{{ _('Inconnu') }}"
        };

        function creerMarqueurColore(feature, latlng) {
            const etat = feature.properties.etat;
            const couleur = couleursEtat[etat] || "gray";
            return L.circleMarker(latlng, {
                radius: 8,
                fillColor: couleur,
                color: "#333",
                weight: 1,
                opacity: 1,
                fillOpacity: 0.85
            });
        }

        function creerPopup(feature, layer) {
            // Récupérer l'état traduit
            const etatBrut = feature.properties.etat ? feature.properties.etat.toLowerCase() : 'inconnu';
            const etatTraduit = traductionsEtat[etatBrut] || etatBrut;

            layer.bindPopup(
                "<strong>{{ _('Adresse') }}:</strong> " + feature.properties.adresse +
                "<br><strong>{{ _('État') }}:</strong> " + etatTraduit +
                "<br><strong>{{ _('Date') }}:</strong> " + feature.properties.date +
                "<br><a href='/result/" + feature.properties.image_id + "'>{{ _('Voir le détail') }} →</a>"
            );
        }

        // Récupère les états actuellement cochés dans les filtres
        function getEtatsSelectionnes() {
            return Array.from(document.querySelectorAll('.filtre-etat:checked')).map(cb => cb.value);
        }

        // Reconstruit les marqueurs affichés en fonction des filtres cochés
        function appliquerFiltre() {
            const etatsSelectionnes = getEtatsSelectionnes();

            markers.clearLayers();

            const featuresFiltrees = toutesLesFeatures.filter(feature => {
                const etat = feature.properties.etat ? feature.properties.etat.toLowerCase() : "inconnu";
                return etatsSelectionnes.includes(etat);
            });

            const geoJsonLayer = L.geoJSON(
                { type: "FeatureCollection", features: featuresFiltrees },
                {
                    pointToLayer: creerMarqueurColore,
                    onEachFeature: creerPopup
                }
            );

            markers.addLayer(geoJsonLayer);
        }

        async function chargerZonesRisque() {
            try {
                const response = await fetch('/api/agglomeration/geojson');
                const geojsonData = await response.json();

                toutesLesFeatures = geojsonData.features || [];
                appliquerFiltre();
            } catch (error) {
                console.error("Erreur lors du chargement :", error);
            }
        }

        // On réapplique le filtre à chaque changement de case cochée
        document.querySelectorAll('.filtre-etat').forEach(checkbox => {
            checkbox.addEventListener('change', appliquerFiltre);
        });

        chargerZonesRisque();
    </script>
{% endblock %}
